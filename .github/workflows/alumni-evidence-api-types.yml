name: Temporary alumni evidence frontend API types
on:
  push:
    branches:
      - codex/alumni-evidence-beyond-pool
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-backend
          ref: codex/alumni-evidence-beyond-pool
          path: backend-snapshot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build frontend types from companion backend branch
        run: |
          npm ci
          ./node_modules/.bin/openapi-typescript backend-snapshot/openapi.json -o src/lib/api-types.ts
          cp backend-snapshot/openapi.json src/lib/openapi.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/lib/api-types.ts src/lib/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): sync generated API types for alumni and learning"
            git push origin HEAD:codex/alumni-evidence-beyond-pool
          fi
