name: One-shot consolidated OpenAPI types
on:
  push:
    branches: [integration/october-features-2026]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[integration-types-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/october-features-2026
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Fetch exact integration backend OpenAPI
        run: |
          mkdir -p ../swimbuddz-backend
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Ugo5738/swimbuddz-backend/integration/october-features-2026/openapi.json -o ../swimbuddz-backend/openapi.json
          python -m json.tool ../swimbuddz-backend/openapi.json > /dev/null
      - run: npm run generate:types
      - name: Commit generated schema types
        run: |
          git diff --check
          if ! git diff --quiet -- src/lib/api-types.ts src/lib/openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/api-types.ts src/lib/openapi.json
            git commit -m "chore(integration): generate types from combined backend contract [integration-types-generated]"
            git push origin HEAD:integration/october-features-2026
          fi
