name: Temporary My Media API Client
on:
  push:
    branches: [feature/member-my-media-playback-links-20261016]
    paths: [.github/workflows/temp-my-media-client-20261016.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-my-media-playback-links-20261016
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-backend
          ref: feature/member-my-media-playback-links-20261016
          path: swimbuddz-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          npm ci
          npx openapi-typescript swimbuddz-backend/openapi.json -o src/lib/api-types.ts
          cp swimbuddz-backend/openapi.json src/lib/openapi.json
      - run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add src/lib/api-types.ts src/lib/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync My Media frontend client with latest backend API"
            git push origin HEAD:feature/member-my-media-playback-links-20261016
          fi
