name: Temporary API Type Regeneration

on:
  push:
    branches:
      - feature/quarterly-business-review

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-frontend
          ref: feature/quarterly-business-review
          path: swimbuddz-frontend
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-backend
          ref: feature/quarterly-business-review
          path: swimbuddz-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: swimbuddz-frontend/package-lock.json
      - name: Install dependencies
        working-directory: swimbuddz-frontend
        run: npm ci
      - name: Regenerate API types
        working-directory: swimbuddz-frontend
        run: npm run generate:types
      - name: Commit generated contract
        working-directory: swimbuddz-frontend
        run: |
          if git diff --quiet -- src/lib/api-types.ts src/lib/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api-types.ts src/lib/openapi.json
          git commit -m "chore(api): regenerate frontend API types"
          git push origin HEAD:feature/quarterly-business-review
