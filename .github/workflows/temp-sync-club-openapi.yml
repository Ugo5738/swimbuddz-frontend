name: Temporary Club OpenAPI frontend type sync
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Generate types from exact backend contract
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/Ugo5738/swimbuddz-backend/1e1fa28743a97a3bc5bc32830f2eb4266541ed81/openapi.json --output src/lib/openapi.json
          npx openapi-typescript src/lib/openapi.json -o src/lib/api-types.ts
          git add src/lib/openapi.json src/lib/api-types.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync Club video assessment API types"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
