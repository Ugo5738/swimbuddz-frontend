name: Sync API contract on admin UX branch

on:
  push:
    branches:
      - feature/admin-operations-ux

permissions:
  contents: write

jobs:
  sync-api-contract:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-operations-ux
          path: swimbuddz-frontend
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-backend
          ref: feature/admin-operations-ux
          path: swimbuddz-backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: swimbuddz-frontend/package-lock.json
      - name: Install dependencies
        working-directory: swimbuddz-frontend
        run: npm ci
      - name: Generate frontend API contract
        working-directory: swimbuddz-frontend
        run: npm run generate:types
      - name: Commit generated contract
        working-directory: swimbuddz-frontend
        run: |
          if git diff --quiet -- src/lib/api-types.ts src/lib/openapi.json; then
            echo "Frontend API contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api-types.ts src/lib/openapi.json
          git commit -m "chore(api): sync admin UX API contract"
          git push origin HEAD:feature/admin-operations-ux
