name: Temporary Session Media API Types

on:
  push:
    branches:
      - feature/session-media-upload-clips-20261015
    paths:
      - .github/workflows/temp-session-media-types-20261015.yml

permissions:
  contents: write

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-media-upload-clips-20261015
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ugo5738/swimbuddz-backend
          ref: feature/session-media-upload-clips-20261015
          path: swimbuddz-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Generate typed API
        run: |
          npm ci
          npx openapi-typescript swimbuddz-backend/openapi.json -o src/lib/api-types.ts
          cp swimbuddz-backend/openapi.json src/lib/openapi.json
      - name: Commit contract files
        run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add src/lib/api-types.ts src/lib/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh frontend types for session media access and clip APIs"
            git push origin HEAD:feature/session-media-upload-clips-20261015
          fi
